name: mediavpn-preview
services:
  app:
    build: .
    ports:
      - "${MEDIAVPN_BIND:-127.0.0.1}:${MEDIAVPN_PORT:-18802}:18802"
    environment:
      MEDIAVPN_BASE_URL: ${MEDIAVPN_BASE_URL:-http://127.0.0.1:18802}
      MEDIAVPN_DATA: /data
    volumes:
      - appdata:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen(os.environ['MEDIAVPN_BASE_URL'] + '/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  appdata: